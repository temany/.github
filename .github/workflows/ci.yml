name: Organization Profile CI Pipeline

on:
  push:
    branches:
      - dev
      - prod
  pull_request:
    branches:
      - dev
      - prod

jobs:
  validate-profile:
    name: Validate Markdown and Assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify zero emojis in repository
        run: |
          python3 -c "
          import os, sys, re
          emoji_pattern = re.compile(r'[\U00010000-\U0010ffff]|[\u2600-\u27bf]')
          violations = []
          for root, _, files in os.walk('.'):
              if '.git' in root:
                  continue
              for f in files:
                  if f.endswith(('.md', '.svg', '.yml', '.yaml')):
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as fp:
                          for line_no, line in enumerate(fp, 1):
                              if emoji_pattern.search(line):
                                  violations.append((path, line_no))
          if violations:
              print(f'FAILED: {len(violations)} emojis detected in .github')
              sys.exit(1)
          print('PASS: Zero emojis verified in .github')
          "

      - name: Verify required files exist
        run: |
          test -f profile/README.md
          test -f assets/banner.svg
          test -f assets/logo.png
          echo "All required profile files and assets are present."
